general {
  ignore_empty_input = true
  text_trim = false
}

animations {
  animation = global, 1, 1, linear
}

auth {
  fingerprint {
    enabled = true
  }
}

input-field {
  size = 99.8%, 99.8%
  rounding = 0
  inner_color = 0

  hide_input = true
  placeholder_text =
  fail_text =
}

shape {
  zindex = 1
  size = 99.8%, 99.8%
  color = 0
  onclick = true
}

background {
  path = screenshot
  blur_passes = 3
  blur_size = 1
}

label {
  valign = top
  position = 0, -5
  font_size = 11
  text = cmd[update:1000] date +'%A %d %B %Y %X'
}

shape {
  valign = top
  size = 100%, 32
}
