name: Run nix flake check
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

jobs:
  droid-bootstrap:
    permissions:
      contents: write
      pages: write
      id-token: write

    uses: ./.github/workflows/droid-bootstrap.yml

  nix-flake-check:
    needs: droid-bootstrap

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Wandalen/wretry.action/main@master
        with:
          action: actions/download-artifact@main
          with: 'name: .ssh'
          attempt_limit: 10
          attempt_delay: 5000

      - run: |
          mkdir ~/.config/nix
          mv nix.conf ~/.config/nix

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - run: nix flake check
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going

  respository-chore:
    needs: nix-flake-check

    permissions:
      actions: write
      deployments: write

    runs-on: ubuntu-latest
    steps:
      - uses: int128/delete-deployments-action@v1
      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
