name: Run nix flake check
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

jobs:
  droid-bootstrap:
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/droid-bootstrap.yml

  nix-flake-check:
    needs: droid-bootstrap

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        with:
          nix-permission-edict: true
      - uses: nixbuild/nix-quick-install-action@master

      - uses: actions/checkout@main
      - run: nix run home-manager -- switch
          --flake .#$(nix config show system)

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going

  respository-chore:
    needs: nix-flake-check

    permissions:
      deployments: write
      actions: write

    runs-on: ubuntu-latest
    steps:
      - uses: int128/delete-deployments-action@v1
      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
