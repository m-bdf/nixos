name: debug
on:
  push:
  workflow_dispatch:

jobs:
  generate-ssh-key:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir ssh
          sudo ssh-keygen -t rsa -N '' -f ssh/nixremote
          sudo chmod -R 777 ssh

      - uses: actions/upload-artifact@main
        with:
          path: ssh

  tmate-aarch64:
    needs: generate-ssh-key

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
      - run: |
          mkdir ~/.ssh
          cat nixremote.pub > ~/.ssh/authorized_keys

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            always-allow-substitutes = true
            builders-use-substitutes = true

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master

  tmate-x86_64:
    needs: generate-ssh-key

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
      - run: |
          sudo cp nixremote* /root/.ssh

          echo '
          Host ssh-j.com m-bdf.nixos
            IdentitiesOnly yes
            IdentityFile /root/.ssh/nixremote
            User runner
          ' > /root/.ssh/config

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            always-allow-substitutes = true
            builders-use-substitutes = true

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master
