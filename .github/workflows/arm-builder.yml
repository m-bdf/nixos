name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}
  NIX_CONF_DIR: ~/.ssh

jobs:
  setup-arm-builder:
    permissions: {}

    runs-on: ubuntu-24.04-arm
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - run: |
          ssh-keygen -t rsa -N '' -f ~/.ssh/id_rsa
          mv ~/.ssh/{id_rsa.pub,authorized_keys}

          printf > ~/.ssh/config "
            Host * \n StrictHostKeyChecking no
            Host $ARM_BUILDER \n ProxyJump $JUMP_PROXY
          "

      - run: |
          printf > ~/.ssh/nix.conf "
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = %s %s - %s - %s
            builders-use-substitutes = true
          " \
            ssh-ng://$USER@$ARM_BUILDER \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ')

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: ~/.ssh

      - run: |
          chmod 755 ~
          sudo chsh $USER -s /bin/bash
          ssh $JUMP_PROXY -R $ARM_BUILDER:22:localhost:22 -N
