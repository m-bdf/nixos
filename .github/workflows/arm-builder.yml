name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

jobs:
  fetch-nix-install:
    runs-on: ubuntu-latest
    steps:
      - uses: nixbuild/nix-quick-install-action@master
      - uses: actions/checkout@main
      - run: |
          nix build --inputs-from . nix#binaryTarball
          tar -xf result/nix-*.tar.xz

      - uses: actions/upload-artifact@main
        with:
          name: nix-install
          path: nix-*

  setup-nix-config:
    needs: fetch-nix-install

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
        with:
          name: nix-install
          path: /tmp/nix-install

      - uses: cachix/install-nix-action@master
        with:
          install_url: file:///tmp/nix-install

      - run: |
          printf > nix.conf "
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = ssh-ng://arm-builder %s - %s - %s
            builders-use-substitutes = true
          " \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ')

      - uses: actions/upload-artifact@main
        with:
          name: nix
          path: .

  setup-ssh-config:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ssh-keygen -t rsa -N '' -f id_rsa
          mv id_rsa.pub authorized_keys

      - run: |
          echo > config "
            BatchMode yes
            StrictHostKeyChecking no
            PasswordAuthentication no

          Host proxy-jump
            HostName ssh-j.com
            User ${{ github.repository }}/${{ github.run_id }}
            RemoteForward arm-builder:22 localhost:22
            ExitOnForwardFailure yes

          Host arm-builder
            ProxyJump proxy-jump
          "

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: .
