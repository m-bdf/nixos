name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

permissions: {}
env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  setup-nix:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - run: |
          printf > nix.conf "
            builders = ssh-ng://$ARM_BUILDER %s - %s - %s
            builders-use-substitutes = true
            download-buffer-size = $((64 * 1024 ** 3)) # 64 GiB
          " \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ')

      - uses: actions/upload-artifact@main
        with:
          name: nix.conf
          path: nix.conf

  setup-ssh:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          ssh-keygen -t rsa -N '' -f id_rsa
          cp id_rsa.pub authorized_keys

          printf > config "
            Host * \n StrictHostKeyChecking no
            Host $ARM_BUILDER \n ProxyJump $JUMP_PROXY
          "

          sudo cp -R . /root/.ssh && cp -R . ~/.ssh

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: .

      - run: sudo ssh $JUMP_PROXY -NR $ARM_BUILDER:22:localhost:22
