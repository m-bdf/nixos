name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

jobs:
  setup-nix-config:
    permissions: {}

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          printf > nix.conf "
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = ssh-ng://arm-builder %s - %s - %s
            builders-use-substitutes = true
          " \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ')

      - uses: actions/upload-artifact@main
        with:
          name: nix.conf
          path: nix.conf

  setup-ssh-config:
    permissions: {}

    runs-on: ubuntu-latest
    steps:
      - run: |
          ssh-keygen -t rsa -N '' -f ~/.ssh/id_rsa
          mv ~/.ssh/{id_rsa.pub,authorized_keys}

      - run: |
          echo > ~/.ssh/config "
            Host *
              BatchMode yes
              StrictHostKeyChecking no
              PasswordAuthentication no

            Host proxy-jump
              HostName ssh-j.com
              User ${{ github.repository }}/${{ github.run_id }}
              RemoteForward arm-builder:22 localhost:22
              ExitOnForwardFailure yes

            Host arm-builder
              ProxyJump proxy-jump
              User $USER
          "

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: ~/.ssh
          include-hidden-files: true
