name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  setup-arm-builder:
    permissions: {}

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - run: |
          ls -la ~
          mkdir -p .ssh .config/nix
          ssh-keygen -t rsa -N '' -f .ssh/id_rsa
          mv .ssh/id_rsa.pub .ssh/authorized_keys

          printf > .ssh/config "
            Host * \n StrictHostKeyChecking no
            Host $ARM_BUILDER \n ProxyJump $JUMP_PROXY
          "

      - run: |
          printf "
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = ssh-ng://$USER@$ARM_BUILDER %s - %s - %s
            builders-use-substitutes = true
          " \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ') > .config/nix/nix.conf

      - uses: actions/upload-artifact@main
        with:
          name: home
          path: .
          include-hidden-files: true

      - run: |
          cp -R . ~
          sudo chmod 755 ~
          sudo cp -R . /root
          sudo chown -R root:root /root

      - run: ssh $JUMP_PROXY -NR $ARM_BUILDER:22:localhost:22
