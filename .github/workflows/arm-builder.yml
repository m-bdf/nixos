name: Setup ARM remote builder
on:
  workflow_call:
  workflow_dispatch:

env:
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  setup-arm-builder:
    permissions: {}

    runs-on: ubuntu-24.04-arm
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - run: |
          ssh-keygen -t rsa -N '' -f ~/.ssh/id_rsa
          mv ~/.ssh/{id_rsa.pub,authorized_keys}

          echo > ~/.ssh/config "
            Host *
              BatchMode yes
              StrictHostKeyChecking no
              PasswordAuthentication no

            Host proxy-jump
              HostName ssh-j.com
              User ${{ github.repository }}
              RemoteForward $ARM_BUILDER:22 localhost:22
              ExitOnForwardFailure yes

            Host arm-builder
              ProxyJump proxy-jump
              HostName $ARM_BUILDER
              User $USER
          "

      - run: |
          printf > ~/.ssh/nix.conf "
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = ssh-ng://arm-builder %s - %s - %s
            builders-use-substitutes = true
          " \
            $(nix config show --json | jq -r '
              (."system".value, ."max-jobs".value),
              (."system-features".value | join(","))
            ')

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: ~/.ssh
          include-hidden-files: true
          if-no-files-found: error

      - run: |
          chmod 755 ~
          sudo chsh $USER -s /bin/bash
          ssh proxy-jump -N
