name: Build NixOnDroid bootstrap files
on:
  workflow_call:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    uses: ./.github/workflows/arm-builder.yml

  start-arm-builder:
    needs: setup-arm-builder

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
      - run: |
          sudo cp -R .ssh /root

      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - run: sudo ssh proxy-jump -N

  build-bootstrap-zips:
    needs: setup-arm-builder

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
      - run: |
          mv nix ~/.config
          sudo cp -R .ssh /root

      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix build --expr 'derivation {
            name = "test";
            system = "aarch64-linux";
            builder = "/bin/sh";
            args = [ "-c" "echo > $out" ];
          }' --show-trace --print-build-logs

      # - uses: actions/checkout@main
      # - run: nix build .#nixOnDroidBootstrapZips
      #     --accept-flake-config
      #     --trace-verbose --show-trace
      #     --print-build-logs --keep-going

      - if: always()
        run: sudo ssh arm-builder -f killall ssh

      - uses: actions/upload-pages-artifact@main
        with:
          path: result
