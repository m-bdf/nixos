name: Build NixOnDroid bootstrap files
on:
  workflow_call:
  workflow_dispatch:

env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  build-bootstrap-zips:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Wandalen/wretry.action/main@master
        with:
          action: actions/download-artifact@main
          with: 'name: .ssh'
          attempt_limit: 10
          attempt_delay: 5000

      - run: |
          mkdir ~/.config/nix
          mv nix.conf ~/.config/nix
          chmod 400 id_rsa
          sudo cp * /root/.ssh

      - run: |
          nix build --expr 'derivation {
            name = "test";
            system = "aarch64-linux";
            builder = "/bin/sh";
            args = [ "-c" "echo > $out" ];
          }' --show-trace --print-build-logs

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # - uses: actions/checkout@main
      # - run: nix build .#nixOnDroidBootstrapZips
      #     --accept-flake-config
      #     --trace-verbose --show-trace
      #     --print-build-logs --keep-going

      - if: always()
        run: ssh $ARM_BUILDER pkill ssh
        continue-on-error: true

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy-bootstrap-zips:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
