name: Build NixOnDroid bootstrap files
on:
  workflow_call:
  workflow_dispatch:

jobs:
  start-arm-builder:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
        with: ${{ secrets }}
      - uses: ./.github/actions/setup-arm-builder

  build-bootstrap-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
        with: ${{ secrets }}
      - uses: ./.github/actions/setup-arm-builder

      - run: nix build .#nixOnDroidBootstrapZips -j1 -L
      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy-bootstrap-zips:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-slim
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
