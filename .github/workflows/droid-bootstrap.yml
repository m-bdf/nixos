name: Build NixOnDroid bootstrap files
on:
  workflow_call:
  workflow_dispatch:

jobs:
  start-arm-builder:
    runs-on: ubuntu-24.04-arm
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
      - uses: ./.github/actions/setup-arm-builder

      - run: sudo ssh proxy-jump -N

  build-bootstrap-zips:
    runs-on: ubuntu-latest
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
      - uses: ./.github/actions/setup-arm-builder

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix build --expr 'derivation {
            name = "test";
            system = "aarch64-linux";
            builder = "/bin/sh";
            args = [ "-c" "echo > $out" ];
          }' --show-trace --print-build-logs

      # - run: nix build .#nixOnDroidBootstrapZips
      #     --accept-flake-config
      #     --trace-verbose --show-trace
      #     --print-build-logs --keep-going

      - if: always()
        run: sudo ssh arm-builder -f killall ssh

      # - uses: actions/upload-pages-artifact@main
      #   with:
      #     path: result
