name: Build NixOnDroid bootstrap files
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types:
      - arm-builder-ssh-config-uploaded

jobs:
  setup-arm-builder:
    if: github.event_name != 'repository_dispatch'

    permissions:
      contents: write

    uses: ./.github/workflows/arm-builder.yml

  build-bootstrap-zips:
    if: github.event_name == 'repository_dispatch'

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: actions/download-artifact@main
        with:
          artifact-ids: ${{ github.event.client_payload.artifact-id }}

      - run: |
          mkdir ~/.config/nix
          mv nix.conf ~/.config/nix
          chmod 400 id_rsa
          sudo cp * /root/.ssh

      # - run: |
      #     nix build --expr 'derivation {
      #       name = "test";
      #       system = "aarch64-linux";
      #       builder = "/bin/sh";
      #       args = [ "-c" "echo > $out" ];
      #     }' --show-trace --print-build-logs

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - run: nix build .#nixOnDroidBootstrapZips
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going

      - if: always()
        run: sudo ssh arm-builder -f killall ssh

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy-bootstrap-zips:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
