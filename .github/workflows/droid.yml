name: droid
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  export-ssh-dir:
    runs-on: ubuntu-slim
    steps:
      - run: |
          mkdir -p .config/nix .ssh
          ssh-keygen -t rsa -N '' -f .ssh/id_rsa
          cp .ssh/id_rsa.pub .ssh/authorized_keys

          printf > .ssh/config "
            Host * \n StrictHostKeyChecking no
            Host $ARM_BUILDER \n ProxyJump $JUMP_PROXY
          "

          echo > .config/nix/nix.conf "
            builders = $ARM_BUILDER aarch64-linux - 4 2
            builders-use-substitutes = true
            download-buffer-size = $((2 ** 42))
          "

      - uses: actions/upload-artifact@main
        with:
          name: home
          path: .
          include-hidden-files: true

  setup-arm-builder:
    needs: export-ssh-dir

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 .ssh/id_rsa && sudo cp -R . /root

      - uses: DeterminateSystems/nix-installer-action@main
      - run: sudo cat /root/.config/nix/nix.conf
      - run: sudo ssh $JUMP_PROXY -R $ARM_BUILDER:22:localhost:22 -Nf
      - run: sleep infinity

  build-bootstrap-zips:
    needs: export-ssh-dir

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 .ssh/id_rsa && sudo cp -R . /root

      - run: sudo cat /root/.config/nix/nix.conf
      - run: sleep 20 && sudo ssh $ARM_BUILDER nix config show

      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: actions/checkout@main
      # - uses: cachix/cachix-action@master
      #   with:
      #     name: m-bdf
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#nixOnDroidBootstrapZips
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going

      - if: always()
        run: sudo ssh $ARM_BUILDER shutdown now

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
