name: droid
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

env:
  JUMP_PROXY: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  export-ssh-dir:
    runs-on: ubuntu-slim
    steps:
      - run: |
          ssh-keygen -t rsa -N '' -f id_rsa
          cp id_rsa.pub authorized_keys

          printf "
            Host * \n StrictHostKeyChecking no
            Host $ARM_BUILDER \n ProxyJump $JUMP_PROXY
          " > config

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: .

  setup-arm-builder:
    needs: export-ssh-dir

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 id_rsa && sudo cp * /root/.ssh

      - uses: DeterminateSystems/nix-installer-action@main
      - run: sudo ssh $JUMP_PROXY -R $ARM_BUILDER:22:localhost:22 -Nv
        continue-on-error: true

  build-bootstrap-zips:
    needs: export-ssh-dir

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 id_rsa && sudo cp * /root/.ssh

      - run: |
          sudo apt update
          sudo apt remove man-db
          sudo apt install qemu-user-static

      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders-use-substitutes = true
            download-buffer-size = 4398046511104
            extra-platforms = aarch64-linux

      - uses: actions/checkout@main
      # - uses: cachix/cachix-action@master
      #   with:
      #     name: m-bdf
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run:
          nix build .#nixOnDroidBootstrapZips
            --accept-flake-config
            --trace-verbose --show-trace
            --print-build-logs --keep-going
            --builders "$ARM_BUILDER aarch64-linux - 4 2"

      - if: always()
        run: sudo ssh $ARM_BUILDER shutdown now
        continue-on-error: true

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
