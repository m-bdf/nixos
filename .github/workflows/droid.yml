name: droid
on:
  # push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt remove man-db
          sudo apt install qemu-user-static

      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
          extra-conf: |
            extra-platforms = aarch64-linux

            experimental-features = auto-allocate-uids blake3-hashes build-time-fetch-tree ca-derivations cgroups configurable-impure-env daemon-trust-override dynamic-derivations external-builders fetch-closure fetch-tree flakes git-hashing impure-derivations local-overlay-store mounted-ssh-store nix-command no-url-literals parallel-eval parse-toml-timestamps pipe-operators read-only-local-store recursive-nix verified-fetches
            # system-features = benchmark big-parallel kvm nixos-test uid-range

            # use-xdg-base-directories = true
            # flake-registry = ""
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            # auto-allocate-uids = true
            # use-cgroups = true
            # keep-outputs = true
            # download-buffer-size = 1073741824 # 1GiB

      - uses: actions/checkout@main
      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#nixOnDroidBootstrapZips
          --accept-flake-config --impure
          --trace-verbose --show-trace
          --print-build-logs --keep-going

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
