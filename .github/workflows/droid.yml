name: droid
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

env:
  JUMP_HOST: ${{ github.repository }}@ssh-j.com
  ARM_BUILDER: arm-builder-${{ github.run_id }}

jobs:
  export-ssh-dir:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo cat /etc/ssh/ssh_host_rsa_key > id_rsa
          cp /etc/ssh/ssh_host_rsa_key.pub authorized_keys
          printf 'Host *\n StrictHostKeyChecking no' > config

      - uses: actions/upload-artifact@main
        with:
          name: .ssh
          path: .

  setup-arm-builder:
    needs: export-ssh-dir

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 id_rsa && sudo cp * /root/.ssh
      - run: mkdir ~/.ssh && cp authorized_keys ~/.ssh

      - uses: DeterminateSystems/nix-installer-action@main
      - run: sudo ssh $JUMP_HOST -R $ARM_BUILDER:22:localhost:22 -N

  build-bootstrap-zips:
    needs: export-ssh-dir

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
      - run: chmod 400 id_rsa && sudo cp * /root/.ssh
      - run: mkdir ~/.ssh && cp authorized_keys ~/.ssh

      # - run: |
      #     sudo apt update
      #     sudo apt remove man-db
      #     sudo apt install qemu-user-static

      # - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders-use-substitutes = true
            download-buffer-size = 4398046511104
            # extra-platforms = aarch64-linux

      - uses: actions/checkout@main
      # - uses: cachix/cachix-action@master
      #   with:
      #     name: m-bdf
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run:
          nix build .#nixOnDroidBootstrapZips
            --accept-flake-config
            --trace-verbose --show-trace
            --print-build-logs --keep-going
            --builders "$ARM_BUILDER aarch64-linux"
        env:
          NIX_SSHOPTS: -J $JUMP_HOST

      - if: always()
        run: ssh -J $JUMP_HOST $ARM_BUILDER shutdown now

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build-bootstrap-zips
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
