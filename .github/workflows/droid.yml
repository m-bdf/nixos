name: droid
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

jobs:
  export-ssh-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@main
        with:
          path: ~/.ssh/id_rsa

      - id: export-public-key
        run: echo "public-key=$(cat ~/.ssh/id_rsa.pub)" >> $GITHUB_OUTPUT

    outputs:
      public-key: ${{ steps.export-public-key.outputs.public-key }}

  setup-arm-builder:
    needs: export-ssh-key

    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo >> ~/.ssh/authorized_keys
          ${{ needs.export-ssh-key.outputs.public-key }}

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            always-allow-substitutes = true
            builders-use-substitutes = true

      - run:
          ssh ${{github.repository}}@ssh-j.com
            -R ${{github.run_id}}:22:localhost:22
            -o StrictHostKeyChecking=no -Nv

  build:
    # needs: export-ssh-key

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          path: ~/.ssh
      - run: ls -laR ~/.ssh

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            always-allow-substitutes = true
            builders-use-substitutes = true

      - uses: actions/checkout@main
      # - uses: cachix/cachix-action@master
      #   with:
      #     name: m-bdf
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#nixOnDroidBootstrapZips
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going
          --max-jobs 1
          --store local
          --builders '${{github.run_id}} aarch64-linux'
        env:
          NIX_SSHOPTS: -J ${{github.repository}}@ssh-j.com

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
