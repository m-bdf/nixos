name: droid
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 42 23 * * *

jobs:
  setup-arm-builder:
    permissions:
      contents: read

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: actions/checkout@main
      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: tmate
        uses: mxschmitt/action-tmate/detached@master

    outputs:
      ssh-address: ${{ steps.tmate.outputs.ssh-address }}

  build:
    needs: setup-arm-builder
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0
            builders = ssh://${{
              needs.setup-arm-builder.outputs.ssh-address
            }} aarch64-linux

      - uses: actions/checkout@main
      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#nixOnDroidBootstrapZips
          --accept-flake-config
          --trace-verbose --show-trace
          --print-build-logs --keep-going
          --max-jobs 1

      - uses: actions/upload-pages-artifact@main
        with:
          path: result

  deploy:
    needs: build
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
