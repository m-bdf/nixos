name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Wandalen/wretry.action/main@master
        with:
          action: actions/download-artifact@main
          with: 'name: home'
          attempt_limit: 10
          attempt_delay: 5000

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master

      - if: always()
        run: sudo ssh $ARM_BUILDER pkill ssh
        continue-on-error: true
