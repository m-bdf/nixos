name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: nixbuild/nix-quick-install-action@master

      - uses: actions/checkout@main
      - run: nix run home-manager -- switch
          --flake .#$(nix config show system)

      - uses: Wandalen/wretry.action@master
        with:
          action: actions/download-artifact@main
          attempt_limit: 10
          attempt_delay: 5000

      - run: |
          chmod 400 id_rsa
          cp -R . ~/.ssh
          sudo cp -R . ~/.ssh
          sudo chown -R root:root /root/.ssh

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: mxschmitt/action-tmate@master

      - if: always()
        run: sudo ssh $ARM_BUILDER pkill ssh
        continue-on-error: true
