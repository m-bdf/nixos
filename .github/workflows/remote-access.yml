name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: Wandalen/wretry.action@master
        with:
          action: actions/download-artifact@main
          attempt_limit: 10
          attempt_delay: 5000

      - uses: gacts/run-and-post-run@main
        with:
          run: |
            chmod 400 .ssh/id_rsa
            cp -R .ssh .config ~
            sudo cp -R .ssh .config /root
            sudo chown -R root:root /root
          post: sudo ssh $ARM_BUILDER pkill ssh

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master
