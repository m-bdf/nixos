name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: Wandalen/wretry.action@master
        with:
          action: actions/download-artifact@main
          attempt_limit: 10
          attempt_delay: 5000

      - run: |
          chmod 400 .ssh/id_rsa
          cp -R .ssh .config ~
          sudo cp -R .ssh .config /root
          sudo chown -R root:root /root

      - run: |
          cat ~/.config/nix/nix.conf
          sudo cat /root/.config/nix/nix.conf
          sudo cat /etc/nix/nix.conf
          sudo cat /etc/nix/nix.custom.conf
          nix config show

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          cat ~/.config/nix/nix.conf
          sudo cat /root/.config/nix/nix.conf
          sudo cat /etc/nix/nix.conf
          sudo cat /etc/nix/nix.custom.conf
          nix config show

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master

      - if: always()
        run: sudo ssh $ARM_BUILDER pkill ssh
        continue-on-error: true
