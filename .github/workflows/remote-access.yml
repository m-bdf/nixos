name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    uses: ./.github/workflows/arm-builder.yml

  start-arm-builder:
    needs: setup-arm-builder

    runs-on: ubuntu-24.04-arm
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix

      - run: sudo ssh proxy-jump -N

  setup-remote-access:
    needs: setup-arm-builder

    runs-on: ubuntu-latest
    steps:
      # - uses: wimpysworld/nothing-but-nix@main
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: owenthereal/action-upterm@main

      - if: always()
        run: sudo ssh arm-builder -f killall ssh
