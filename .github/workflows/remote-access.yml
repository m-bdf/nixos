name: Provide remote access for debugging
on:
  push:
  workflow_dispatch:

jobs:
  start-arm-builder:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
      - uses: ./.github/actions/setup-arm-builder

  setup-remote-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: ./.github/actions/install-detnix
      - uses: ./.github/actions/setup-arm-builder

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: owenthereal/action-upterm@main
