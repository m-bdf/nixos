name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: while ! gh run download; do sleep 5; done
        env:
          GH_TOKEN: ${{ github.token }}

      - run: |
          chmod 400 .ssh/id_rsa
          cp -R . ~
          cp -R . /root

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master
