name: Provide remote access for debugging
on:
  workflow_dispatch:

jobs:
  setup-arm-builder:
    permissions: {}
    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-locks = true
            lazy-trees = true
            eval-cores = 0

      - uses: yogeshlonkar/wait-for-jobs@main
        with:
          jobs: setup-arm-builder

      - uses: actions/download-artifact@main
      - run: |
          chmod 400 .ssh/id_rsa
          cp -R .ssh .config ~
          sudo cp -R .ssh .config /root
          sudo chown -R root:root /root

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master
