name: Provide remote access for debugging
on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - arm-builder-ssh-config-uploaded

jobs:
  setup-arm-builder:
    if: github.event_name != 'repository_dispatch'

    permissions:
      contents: read

    uses: ./.github/workflows/arm-builder.yml

  setup-remote-access:
    if: github.event_name == 'repository_dispatch'

    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main

      - uses: actions/download-artifact@main
        with:
          artifact-ids: ${{ github.event.client_payload.artifact-id }}

      - run: |
          mkdir ~/.config/nix
          mv nix.conf ~/.config/nix
          chmod 400 id_rsa
          sudo cp * /root/.ssh

      - uses: cachix/cachix-action@master
        with:
          name: m-bdf
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/checkout@main
      - uses: mxschmitt/action-tmate@master

      - if: always()
        run: sudo ssh arm-builder -f killall ssh
