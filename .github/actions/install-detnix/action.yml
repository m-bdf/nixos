name: Install Determinate Nix

runs:
  using: "composite"
  steps:
    - id: fetch-nix-installer
      uses: actions/download-artifact@main
      with:
        name: nix-installer-${{ runner.arch }}
        path: /tmp/nix-installer
      continue-on-error: true

    - if: steps.fetch-nix-installer.outcome == 'failure'
      uses: DeterminateSystems/nix-installer-action@main

    - if: steps.fetch-nix-installer.outcome == 'failure'
      shell: bash
      run: |
        flake='https://flakehub.com/f/DeterminateSystems/nix-src/*'
        nix flake clone $flake --dest /tmp/nix-src
        cd /tmp/nix-src
        ci/gha/tests/prepare-installer-for-github-actions
        mv out /tmp/nix-installer

    - if: steps.fetch-nix-installer.outcome == 'failure'
      uses: actions/upload-artifact@main
      with:
        name: nix-installer-${{ runner.arch }}
        path: /tmp/nix-installer
        include-hidden-files: true

    - if: steps.fetch-nix-installer.outcome == 'failure'
      shell: bash
      run: /nix/nix-installer uninstall --no-confirm

    - uses: cachix/install-nix-action@master
      with:
        install_url: file:///tmp/nix-installer/install
        install_options:
          --tarball-url-prefix file:///tmp/nix-installer
