name: Install Determinate Nix

runs:
  using: "composite"
  steps:
    - id: fetch-nix-install
      uses: actions/download-artifact@main
      with:
        name: nix-install-${{ runner.arch }}
        path: /tmp/nix
      continue-on-error: true

    - if: steps.fetch-nix-install.outcome == 'failure'
      uses: DeterminateSystems/nix-installer-action@main

    - if: steps.fetch-nix-install.outcome == 'failure'
      shell: bash
      run: |
        flake='https://flakehub.com/f/DeterminateSystems/nix-src/*'
        nix build $flake#installerScriptForGHA $flake#binaryTarball

        mkdir /tmp/nix
        cp result/install /tmp/nix
        name=$(basename $(realpath result-1))
        cp -LR result-1 /tmp/nix/${name%%-*}
        ls -laRL /tmp/nix

    - if: steps.fetch-nix-install.outcome == 'failure'
      uses: actions/upload-artifact@main
      with:
        name: nix-install-${{ runner.arch }}
        path: /tmp/nix
        include-hidden-files: true

    - if: steps.fetch-nix-install.outcome == 'failure'
      shell: bash
      run: /nix/nix-installer uninstall --no-confirm

    - uses: cachix/install-nix-action@master
      with:
        install_url: file:///tmp/nix/install
        install_options: --tarball-url-prefix file:///tmp/nix
