name: Install Determinate Nix

inputs:
  GITHUB_TOKEN:
    default: ${{ github.token }}
  CACHIX_AUTH_TOKEN:
    required: true

runs:
  using: composite
  steps:
    - working-directory: /tmp
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        NIX_REPO: DeterminateSystems/nix-src

      shell: bash
      run: |
        gh --repo $NIX_REPO run download $(
          gh --repo $NIX_REPO run list --event release \
            --json databaseId --jq '.[0].databaseId'
        ) --name $(uname -m)-linux

        tar -xf nix-*.tar.xz
        echo /tmp/nix-*/install '"$@"' > nix-install

    - uses: wimpysworld/nothing-but-nix@main
    - uses: cachix/install-nix-action@master
      with:
        install_url: file:///tmp/nix-install
        extra_nix_config: |
          accept-flake-config = true
          lazy-locks = true
          lazy-trees = true
          builders-use-substitutes = true
          keep-going = true

    - uses: cachix/cachix-action@master
      with:
        name: m-bdf
        authToken: ${{ inputs.CACHIX_AUTH_TOKEN }}
