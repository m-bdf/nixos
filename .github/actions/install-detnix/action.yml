name: Install Determinate Nix

runs:
  using: "composite"
  steps:
    - id: fetch-nix-installer
      uses: actions/download-artifact@main
      with:
        name: nix-installer-${{ runner.arch }}
        path: /tmp/nix-installer
      continue-on-error: true

    - if: steps.fetch-nix-installer.outcome == 'failure'
      uses: DeterminateSystems/nix-installer-action@main

    - if: steps.fetch-nix-installer.outcome == 'failure'
      shell: bash
      run: |
        flake='https://flakehub.com/f/DeterminateSystems/nix-src/*'
        nix build $flake#installerScriptForGHA $flake#binaryTarball
        cp -LR result /tmp/nix-installer
        name=$(basename $(realpath result-1))
        cp -LR result-1 /tmp/nix-installer/${name%%-*}
        rm result*

    - if: steps.fetch-nix-installer.outcome == 'failure'
      uses: actions/upload-artifact@main
      with:
        name: nix-installer-${{ runner.arch }}
        path: /tmp/nix-installer
        include-hidden-files: true

    - if: steps.fetch-nix-installer.outcome == 'failure'
      shell: bash
      run: /nix/nix-installer uninstall --no-confirm

    - uses: cachix/install-nix-action@master
      with:
        install_url: file:///tmp/nix-installer/install
        install_options: --tarball-url-prefix file:///tmp/nix-installer
