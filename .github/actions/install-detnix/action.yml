name: Install Determinate Nix

runs:
  using: "composite"
  steps:
    - shell: bash
      working-directory: /tmp
      env:
        GH_TOKEN: ${{ github.token }}
        NIX_REPO: DeterminateSystems/nix-src
      run: |
        gh --repo $NIX_REPO run download $(
          gh --repo $NIX_REPO run list --event release \
            --json databaseId --jq '.[0].databaseId'
        ) --name $(uname -m)-linux

        tar -xf nix-*.tar.xz
        echo /tmp/nix-*/install '"$@"' > nix-install

    - uses: cachix/install-nix-action@master
      with:
        install_url: file:///tmp/nix-install
        extra_nix_config: |
          lazy-locks = true
          lazy-trees = true
          eval-cores = 0

    - shell: bash
      run: |
        printf > ~/.config/nix/nix.conf "
          builders = ssh-ng://arm-builder %s - %s - %s
          builders-use-substitutes = true
        " \
        $(nix config show --json | jq -r '
          (."system".value, ."max-jobs".value),
          (."system-features".value | join(","))
        ')

    - uses: actions/download-artifact@main
    - shell: bash
      run: |
        chmod 600 id_rsa
        sudo cp -R . /root/.ssh
